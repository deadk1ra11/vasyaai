
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10111a">
<title>Вася AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#f2f3ff;font-family:Arial,sans-serif}
header{padding:18px;border-bottom:1px solid #292b3c;display:flex;align-items:center;gap:12px}
.logo{width:45px;height:45px;border-radius:15px;background:#7464ff;display:grid;place-items:center;font-size:24px;font-weight:bold}
h1{font-size:20px;margin:0}
small{color:#a6a8bd}
main{max-width:760px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
button{border:0;border-radius:12px;padding:12px;background:#282a3b;color:white;font-weight:bold;cursor:pointer}
.tabs button{flex:1}
.tabs button.active,.send{background:#7464ff}
.panel{background:#191b28;border:1px solid #2d3042;border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
input,textarea{width:100%;background:#10111a;border:1px solid #36394e;border-radius:12px;color:white;padding:13px;font:inherit;outline:none;margin-bottom:10px}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus{border-color:#8174ff}
.action{width:100%;margin-top:3px}
#chat{display:flex;flex-direction:column;gap:10px;min-height:160px;max-height:48vh;overflow:auto;margin-bottom:14px}
.msg{padding:12px 14px;border-radius:14px;max-width:95%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#5144bd;align-self:flex-end}
.bot{background:#272a3b;align-self:flex-start}
.hidden{display:none!important}
.result{line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
a{color:#a99eff;overflow-wrap:anywhere}
.status{font-size:12px;color:#9ea1b7;margin-top:7px}
footer{text-align:center;color:#777b95;font-size:12px;padding:15px}
</style>
</head>
<body>
<header>
  <div class="logo">В</div>
  <div>
    <h1>Вася AI</h1>
    <small>ИИ-помощник по сайтам</small>
    <div id="status" class="status">Проверка сервера...</div>
  </div>
</header>

<main>

<div class="tabs">
  <button id="chatTab" class="active">Чат</button>
  <button id="siteTab">Анализ сайта</button>
  <button id="toolsTab">Инструменты</button>
</div>


  <section id="chatPanel" class="panel">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px">
  <h2 style="margin:0">Общение с Васей</h2>
  <button id="clearChat" type="button">Очистить</button>
</div>
    <form id="chatForm">
      <textarea id="message" placeholder="Напиши сообщение..." required maxlength="8000"></textarea>
      <button class="action send" id="sendBtn">Отправить</button>
    </form>
  </section>

  <section id="sitePanel" class="panel hidden">
    <h2>Исследовать сайт</h2>
    <input id="url" type="url" placeholder="https://example.com" required>
    <textarea id="question" placeholder="Что нужно узнать о сайте?">Объясни, что это за сайт, какие у него функции и что можно улучшить.</textarea>
    <button id="inspectBtn" class="action send">Анализировать сайт</button>
    <div id="siteResult" class="result"></div>
  </section>

<section id="toolsPanel" class="panel hidden">
  <h2>Проверка HTML / JavaScript</h2>

  <textarea id="codeInput"
    style="min-height:220px;font-family:monospace"
    placeholder="Вставь сюда HTML или JavaScript-код..."></textarea>

  <button id="checkCode" class="action send">
    Проверить код
  </button>

  <div id="codeResult" class="result"
    style="margin-top:14px"></div>
</section>

  <section class="panel">
    <h2>Возможности</h2>
    <div class="result">
      • Ответы через Gemini
      <br>• Анализ публичных HTML-страниц
      <br>• Извлечение ссылок с сайтов
      <br>• Помощь с кодом и идеями
      <br>• Удобный интерфейс для телефона
    </div>
  </section>
</main>

<footer>Вася AI · Версия 1.0</footer>

<script>
const $ = id => document.getElementById(id);

function switchTab(tab) {
  $("chatPanel").classList.toggle("hidden", tab !== "chat");
  $("sitePanel").classList.toggle("hidden", tab !== "site");
  $("toolsPanel").classList.toggle("hidden", tab !== "tools");

  $("chatTab").classList.toggle("active", tab === "chat");
  $("siteTab").classList.toggle("active", tab === "site");
  $("toolsTab").classList.toggle("active", tab === "tools");
}

$("chatTab").onclick = () => switchTab("chat");
$("siteTab").onclick = () => switchTab("site");
$("toolsTab").onclick = () => switchTab("tools");

async function api(path, data) {
  const response = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.error || "Ошибка сервера");
  }

  return result;
}

function addMessage(text, type) {
  const item = document.createElement("div");
  item.className = "msg " + type;
  item.textContent = text;
  $("chat").appendChild(item);
  $("chat").scrollTop = $("chat").scrollHeight;
  return item;
}

$("chatForm").onsubmit = async event => {
  event.preventDefault();

  const message = $("message").value.trim();
  if (!message) return;

  $("message").value = "";
  addMessage(message, "user");

  const reply = addMessage("Вася думает...", "bot");
  $("sendBtn").disabled = true;

  try {
    const data = await api("/api/chat", {message});
    reply.textContent = data.reply;
  } catch (error) {
    reply.textContent = "Ошибка: " + error.message;
  } finally {
    $("sendBtn").disabled = false;
  }
};

$("inspectBtn").onclick = async () => {
  const url = $("url").value.trim();
  const question = $("question").value.trim();

  if (!url) {
    $("siteResult").textContent = "Сначала введи адрес сайта.";
    return;
  }

  $("inspectBtn").disabled = true;
  $("siteResult").textContent = "Вася изучает страницу...";

  try {
    const data = await api("/api/inspect", {url, question});
    const result = $("siteResult");
    result.replaceChildren();

    const title = document.createElement("h3");
    title.textContent = data.title || "Без названия";
    result.appendChild(title);

    const description = document.createElement("p");
    description.textContent = data.description || "";
    result.appendChild(description);

    const analysis = document.createElement("p");
    analysis.textContent = data.analysis;
    result.appendChild(analysis);

    const heading = document.createElement("h3");
    heading.textContent = "Найденные ссылки";
    result.appendChild(heading);

    (data.links || []).forEach(link => {
      const line = document.createElement("p");
      const a = document.createElement("a");
      a.href = link.url;
      a.textContent = link.label || link.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      line.appendChild(a);
      result.appendChild(line);
    });
  } catch (error) {
    $("siteResult").textContent = "Ошибка: " + error.message;
  } finally {
    $("inspectBtn").disabled = false;
  }
};

async function checkServer() {
  try {
    const response = await fetch("/api/status");
    const data = await response.json();
    $("status").textContent = data.ready
      ? "Сервер подключён · Gemini готов"
      : "Сервер работает, но API-ключ не настроен";
  } catch {
    $("status").textContent = "Сервер не подключён";
  }
}

const HISTORY_KEY = "vasya_ai_history_v1";

function saveHistory() {
  const history = [...$("chat").querySelectorAll(".msg")]
    .map(el => ({
      text: el.textContent,
      type: el.classList.contains("user") ? "user" : "bot"
    }));

  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {
    console.warn("Не удалось сохранить историю", e);
  }
}

function loadHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(HISTORY_KEY) || "[]"
    );

    if (!Array.isArray(saved) || !saved.length) return;

    $("chat").replaceChildren();

    saved.slice(-100).forEach(item => {
      if (
        typeof item.text === "string" &&
        ["user", "bot"].includes(item.type)
      ) {
        addMessage(item.text, item.type);
      }
    });
  } catch (e) {
    console.warn("Не удалось загрузить историю", e);
  }
}

$("clearChat").onclick = () => {
  if (!confirm("Удалить всю историю переписки?")) return;

  $("chat").replaceChildren();

  addMessage(
    "История очищена. Чем займёмся?",
    "bot"
  );

  saveHistory();
};

const originalAddMessage = addMessage;

addMessage = function(text, type) {
  const item = originalAddMessage(text, type);
  saveHistory();
  return item;
};

loadHistory();

$("checkCode").onclick = () => {
  const code = $("codeInput").value;
  const result = $("codeResult");

  result.replaceChildren();

  if (!code.trim()) {
    result.textContent = "Сначала вставь код.";
    return;
  }

  const messages = [];

  if (code.length > 100000) {
    result.textContent = "Код слишком большой для этой проверки.";
    return;
  }

  if (/<script\b[^>]*>[\s\S]*?<\/script\s*>/i.test(code)) {
    messages.push(
      "В HTML найден встроенный JavaScript."
    );
  }

  if (/<img\b(?![^>]*\balt\s*=)[^>]*>/i.test(code)) {
    messages.push(
      "Возможно, у некоторых изображений отсутствует alt."
    );
  }

  if (/<[^>]+>/.test(code) &&
      !/<html\b/i.test(code)) {
    messages.push(
      "Найден HTML-фрагмент. Это не обязательно ошибка."
    );
  }

  if (/\beval\s*\(/.test(code)) {
    messages.push(
      "Предупреждение: eval() может быть небезопасен."
    );
  }

  if (/\binnerHTML\s*=/.test(code)) {
    messages.push(
      "Проверь, не вставляются ли недоверенные данные через innerHTML."
    );
  }

  if (!messages.length) {
    messages.push(
      "Очевидные проблемы из списка проверок не найдены."
    );
  }

  const heading = document.createElement("h3");
  heading.textContent = "Результат проверки";
  result.appendChild(heading);

  messages.forEach(message => {
    const p = document.createElement("p");
    p.textContent = "• " + message;
    result.appendChild(p);
  });

  const note = document.createElement("p");
  note.textContent =
    "Это базовая проверка, а не полноценный анализатор синтаксиса.";
  result.appendChild(note);
};

checkServer();
</script>
</body>
</html>
